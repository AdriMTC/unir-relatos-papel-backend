# ─────────────────────────────────────────────────────────────────
#  Relatos de Papel — Microservicios de Aplicación (Rutas Reales Mac)
#  Uso: docker compose -f docker.yml up --build -d
# ─────────────────────────────────────────────────────────────────



services:

  # ── Servidor de Descubrimiento (Orquestador Central) ─────────────
  eureka-server:
    build: ./eureka # 📁 ¡Correcto! Coincide con tu carpeta 'eureka'
    container_name: relatos-eureka
    restart: always
    ports:
      - "8761:8761"
    networks:
      - relatos-net

  # ── Microservicios de Negocio ────────────────────────────────────

   users-service:
     build: ./ms-users # 📁 CORREGIDO: Apunta a tu carpeta 'ms-users'
     container_name: relatos-users
     restart: always
     ports:
       - "8083:8083"
     depends_on:
       - eureka-server
     networks:
       - relatos-net
     environment:
       - EUREKA_URL=http://eureka-server:8761/eureka/
       - SPRING_REDIS_HOST=relatos-redis
       - REDIS_PASSWORD=
       - DB_URL=jdbc:mysql://relatos-users-db:3306/db_users?createDatabaseIfNotExist=true
       - DB_USER=root
       - DB_PASSWORD=root_password
       - DB_DRIVER=com.mysql.cj.jdbc.Driver

  catalogue-service:
    build: ./catalogue # 📁 ¡Correcto! Coincide con tu carpeta 'catalogue'
    container_name: relatos-catalogue
    restart: always
    ports:
      - "8081:8081"
    depends_on:
      - eureka-server
    networks:
      - relatos-net
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka/
      - CATALOGUE_DB_URL=jdbc:postgresql://catalogue-db:5432/catalogue_db
      - SPRING_REDIS_HOST=relatos-redis

  orders-service:
    build: ./orders # 📁 ¡Correcto! Coincide con tu carpeta 'orders'
    container_name: relatos-orders
    restart: always
    ports:
      - "8082:8082"
    depends_on:
      - eureka-server
    networks:
      - relatos-net
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka/
      - ORDERS_DB_URL=jdbc:postgresql://orders-db:5432/orders_db
      - SPRING_RABBITMQ_HOST=relatos-rabbitmq

   comms-service:
     build: ./ms-comms # 📁 CORREGIDO: Apunta a tu carpeta 'ms-comms'
     container_name: relatos-comms
     restart: always
     ports:
       - "8084:8084"
     depends_on:
       - eureka-server
     networks:
       - relatos-net
     environment:
       - EUREKA_URL=http://eureka-server:8761/eureka/
       - SPRING_RABBITMQ_HOST=relatos-rabbitmq
       - MAIL_HOST=smtp.gmail.com
       - MAIL_PORT=587
       - MAIL_USERNAME=${MAIL_USERNAME}
       - MAIL_PASSWORD=${MAIL_PASSWORD}
       - GEMINI_API_KEY=${GEMINI_API_KEY}

  # ── Puerta de Enlace Criptográfica (API Gateway) ─────────────────

   api-gateway:
     build: ./gateway # 📁 CORREGIDO: Apunta a tu carpeta 'gateway'
     container_name: relatos-gateway
     restart: always
     ports:
       - "8090:8090"
     depends_on:
       - eureka-server
     networks:
       - relatos-net
     environment:
       - EUREKA_URL=http://eureka-server:8761/eureka/
       - EUREKA_HOST=eureka-server
       - SPRING_REDIS_HOST=relatos-redis

# ── Vinculación con la Red de Infraestructura Existente ───────────

networks:
  relatos-net:
    external: true