server:
  port: 8090

spring:
  application:
    name: gateway

  cloud:
    gateway:
      # 🌟 LA MAGIA: globalcors debe estar a este nivel exacto, fuera de discovery
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:
        - id: catalogue
          uri: lb://CATALOGUE-SERVICE
          predicates:
            - Path=/api/v1/books/**
          filters:
            - StripPrefix=0

        - id: orders
          uri: lb://orders-service
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - StripPrefix=0

        - id: ms-users
          uri: lb://USERS
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=0

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    instanceId: ${spring.application.name}:${random.value}
    statusPageUrlPath: ${management.endpoints.web.base-path:/actuator}/health
    hostname: localhost

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      access: unrestricted